name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show repo layout
        run: |
          pwd
          find . -maxdepth 3 -name '*.csproj' -o -maxdepth 3 -name '*.sln*' | head -50

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build APK
        run: |
          PROJ=$(find . -name 'UABEA.Android.Android.csproj' | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "ERROR: UABEA.Android.Android.csproj not found. Upload the full project folder contents."
            exit 1
          fi
          echo "Building: $PROJ"
          dotnet publish "$PROJ" -c Release -f net8.0-android -p:AndroidPackageFormat=apk

      - name: Pick final APK
        run: |
          mkdir -p out
          APK=$(find . -path '*/bin/Release/*' -name '*-Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find . -path '*/bin/Release/*' -name '*.apk' | head -n 1); fi
          echo "Using: $APK"
          cp "$APK" out/UABEA.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UABEA build ${{ github.run_number }}
          files: out/UABEA.apk
