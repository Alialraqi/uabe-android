name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Force SDK 8 (the runner also has SDK 11, which rejects net8.0-android as out of support)
      - name: Pin .NET SDK 8
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": { "version": "8.0.100", "rollForward": "latestFeature" }
          }
          JSON
          dotnet --version

      # Avalonia.Android 11.0.1 needs Android platform version 31 or higher
      - name: Patch target framework
        run: |
          PROJ=$(find . -name 'UABEA.Android.Android.csproj' | head -n 1)
          if [ -z "$PROJ" ]; then echo "ERROR: csproj not found"; exit 1; fi
          sed -i 's|<TargetFramework>net8.0-android[0-9.]*</TargetFramework>|<TargetFramework>net8.0-android34.0</TargetFramework>|' "$PROJ"
          grep TargetFramework "$PROJ"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build APK
        run: |
          PROJ=$(find . -name 'UABEA.Android.Android.csproj' | head -n 1)
          dotnet publish "$PROJ" -c Release -f net8.0-android34.0 \
            -p:AndroidPackageFormat=apk \
            -p:AcceptAndroidSDKLicenses=True \
            -p:InstallAndroidDependencies=True \
            -p:NuGetAudit=false

      - name: Pick final APK
        run: |
          mkdir -p out
          APK=$(find . -path '*/bin/Release/*' -name '*-Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then APK=$(find . -path '*/bin/Release/*' -name '*.apk' | head -n 1); fi
          echo "Using: $APK"
          cp "$APK" out/UABEA.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UABEA build ${{ github.run_number }}
          files: out/UABEA.apk
